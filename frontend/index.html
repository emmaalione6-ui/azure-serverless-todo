<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure Todo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 30px;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    #newtodo {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    #newtodo:focus {
      outline: none;
      border-color: #667eea;
    }
    #addBtn {
      padding: 12px 25px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s;
    }
    #addBtn:hover {
      background: #764ba2;
    }
    h2 {
      color: #333;
      font-size: 18px;
      margin-bottom: 15px;
    }
    #list {
      list-style: none;
    }
    #list li {
      background: #f5f5f5;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    #list li:hover {
      background: #efefef;
    }
    #list li.completed {
      background: #e8f5e9;
      text-decoration: line-through;
      color: #999;
    }
    .todo-content {
      flex: 1;
      cursor: pointer;
      user-select: none;
    }
    .todo-actions {
      display: flex;
      gap: 10px;
    }
    .todo-actions button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .complete-btn {
      background: #4caf50;
      color: white;
    }
    .complete-btn:hover {
      background: #45a049;
    }
    .delete-btn {
      background: #f44336;
      color: white;
    }
    .delete-btn:hover {
      background: #da190b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 My Todos</h1>
    <div class="input-group">
      <input type="text" id="newtodo" placeholder="Add a new todo...">
      <button id="addBtn">Add</button>
    </div>
    <h2>Your Tasks:</h2>
    <ul id="list"></ul>
  </div>

  <script>
    // Use local Functions host during development (file:// or localhost),
    // otherwise use the deployed Function App URL.
    const USER = "demo";
    const API = (function() {
      if (location.protocol === 'file:' || location.hostname === 'localhost') {
        return 'http://localhost:7071/api';
      }
      return 'https://func-todo-api-emmaali50.azurewebsites.net/api';
    })();

    async function loadTodos() {
      try {
        const res = await fetch(`${API}/GetTodos?userId=${USER}`);
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`HTTP ${res.status} ${res.statusText}: ${text}`);
        }
        // Some error responses may be empty or non-JSON; guard parsing.
        const text = await res.text();
        const todos = text ? JSON.parse(text) : [];
        const ul = document.getElementById("list");
        ul.innerHTML = "";
        todos.forEach(t => {
          const li = document.createElement("li");
          if (t.completed) li.classList.add("completed");
          
          const content = document.createElement("div");
          content.className = "todo-content";
          content.textContent = t.title;
          content.onclick = () => toggleComplete(t.id, t.completed);
          li.appendChild(content);
          
          const actions = document.createElement("div");
          actions.className = "todo-actions";
          
          const completeBtn = document.createElement("button");
          completeBtn.className = "complete-btn";
          completeBtn.textContent = t.completed ? "Undo" : "Complete";
          completeBtn.onclick = () => toggleComplete(t.id, t.completed);
          actions.appendChild(completeBtn);
          
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-btn";
          deleteBtn.textContent = "Delete";
          deleteBtn.onclick = () => deleteTodo(t.id);
          actions.appendChild(deleteBtn);
          
          li.appendChild(actions);
          ul.appendChild(li);
        });
      } catch (error) {
        console.error("Error loading todos:", error);
        alert("Failed to load todos. Check console for details.");
      }
    }

    async function toggleComplete(id, currentCompleted) {
      try {
        await fetch(`${API}/UpdateTodo?id=${id}&userId=${USER}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: USER, completed: !currentCompleted })
        });
        loadTodos();
      } catch (error) {
        console.error("Error updating todo:", error);
        alert("Failed to update todo. Check console for details.");
      }
    }

    async function deleteTodo(id) {
      if (!confirm("Delete this todo?")) return;
      try {
        await fetch(`${API}/DeleteTodo?id=${id}&userId=${USER}`, {
          method: "DELETE"
        });
        loadTodos();
      } catch (error) {
        console.error("Error deleting todo:", error);
        alert("Failed to delete todo. Check console for details.");
      }
    }

    async function addTodo() {
      const title = document.getElementById("newtodo").value;
      if (!title.trim()) {
        alert("Please enter a todo");
        return;
      }
      try {
        await fetch(`${API}/CreateTodo`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, userId: USER, id: Date.now().toString() })
        });
        document.getElementById("newtodo").value = "";
        loadTodos();
      } catch (error) {
        console.error("Error adding todo:", error);
        alert("Failed to add todo. Check console for details.");
      }
    }

    document.getElementById("addBtn").addEventListener("click", addTodo);
    document.getElementById("newtodo").addEventListener("keypress", (e) => {
      if (e.key === "Enter") addTodo();
    });

    loadTodos();
  </script>
</body>
</html>
